name: Desktop checks

on:
  push:
    branches:
      - main
      - algeria-localization-roadmap
  pull_request:
    branches:
      - main
      - algeria-localization-roadmap

jobs:
  renderer-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Build renderer
        run: npm run build
